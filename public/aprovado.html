<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - Aprovado</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e8f5e9; color: #2e7d32; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #4caf50; }
        h1 { margin-top: 0; }
        .destaque { font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Parabéns!</h1>
        <p>Você foi <strong>{{situacao}}</strong>.</p>
        <hr>
        <p>Nota P1: <span class="destaque">{{p1}}</span></p>
        <p>Nota P2: <span class="destaque">{{p2}}</span></p>
        <h2>Média Final: {{media}}</h2>
    </div>
</body>
</html>
